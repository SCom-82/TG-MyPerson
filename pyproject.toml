[project]
name = "tg-myperson"
version = "0.1.0"
description = "Telegram Personal Account Bridge: MTProto → PostgreSQL → REST API"
requires-python = ">=3.12"
dependencies = [
    # <0.137: FastAPI 0.137 wraps included routers in _IncludedRouter, and
    # authz _resolve_route_name stops finding route names → ro/policy checks
    # silently pass every write. Do not lift without fixing the resolver.
    "fastapi>=0.115,<0.137",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "telethon>=1.37",
    "cryptg>=0.4",
    "pydantic-settings>=2.7",
    "psycopg2-binary>=2.9",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
    "aiohttp>=3.9",
    # MAX transport. Exact pin: PyMax follows an undocumented protocol and its
    # models change between releases. Bump only by the procedure in README
    # («Платформа MAX → обновление PyMax»): changelog → pin → pytest → deploy.
    "maxapi-python==2.4.1",
    # QR PNG for /auth/qr.png (pure-python PNG writer, no Pillow).
    "qrcode[png]>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx",
    # tests/test_download_media_streaming.py импортирует MCP-клиент
    # (_system/scripts/tg-myperson-mcp.py), который тянет mcp.server.
    # Без этого T8/T9 падают ModuleNotFoundError на чистом main.
    # Верхняя граница обязательна: в mcp 2.x у Server убрали декоратор
    # .list_tools(), а боевой скрипт написан под low-level API 1.x.
    "mcp>=1.0,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
